# t3-boat-sentinel configuration
# Runs on an always-on sentinel host (Proxmox LXC / Docker / VPS).
# Zero project code runs on the sentinel host — all agent execution runs inside disposable Boat VMs.
#
# Tip: Any `${ENV_VAR}` placeholder is expanded from process.env so secrets stay in `.env`.

domain: example.com                  # Wildcard Cloudflare Tunnel: *.example.com -> http://127.0.0.1:8080
controlHost: boat-ctrl.example.com   # Protect with Cloudflare Access (Bypass on /internal/watchdog)
listenHost: 127.0.0.1
listenPort: 8080
stateDir: ./data                     # Persistent state (hashed client tokens, dynamic projects, reaper queue)

# Bearer secret for control API / Dashboard / MCP / iOS Shortcuts (generate: `openssl rand -hex 32`)
controlSecret: ${CONTROL_SECRET}

# Optional push notification webhook (e.g., https://ntfy.sh/your-private-topic)
# notifyUrl: https://ntfy.sh/t3-boat-alerts

# Recommended: Single-Environment Hub Multiplexer (1 Environment -> up to N parallel disposable Boat VMs)
# Pair `https://boat.example.com` ONCE on T3 Desktop & ONCE on T3 Mobile.
# Every new chat automatically spawns 1 fresh isolated Boat VM and destroys ONLY that VM when settled/archived!
hub:
  host: boat.example.com
  label: Boat
  maxSandboxes: 20

# Optional: Modular sandbox backend (defaults to native Boat CLI when omitted).
# Swap to any `@opencoredev/sandbox-sdk` provider (daytona, e2b, docker, vercel, upstash,
# railway, freestyle, boxd, superserve, sandboxer, tenki) after `bun add @opencoredev/sandbox-sdk`:
# provider:
#   type: sandbox-sdk
#   adapter: daytona
#   options: {}
#
# Or run Hub chats on Celesto (celesto.ai) cloud computers. No snapshots: T3 installs at every boot.
# Uploads (boot secrets included) travel inside Celesto exec requests, published URLs are public
# (T3's bearer auth is the only gate) and provider sign-ins are not kept. The Free plan (nano only)
# is too small for T3. Idle computers keep billing while sentinel is down. See README "Celesto".
# provider:
#   type: celesto
#   apiKey: ${CELESTO_API_KEY}   # optional; falls back to the CELESTO_API_KEY environment variable
#   templateId: coding-agent
#   user: ohm
#   sizeMap: { medium: standard }  # optional; default -> standard, medium/large -> large

# Optional: Origin-side link security hardening (in addition to Cloudflare Zero Trust edge policies).
# Verifies `Cf-Access-Jwt-Assertion` (RS256 JWKS) on `controlHost` (exempts `/internal/watchdog`, `/health`, and loopback CLI).
# security:
#   cloudflareAccess:
#     teamDomain: your-team.cloudflareaccess.com
#     aud: ${CF_ACCESS_AUD}
#     allowedEmails:
#       - you@example.com

t3:
  # Recommended: pin an exact T3 version matching your Desktop/Mobile clients, or "latest"
  version: latest
  # Channel: "stable" or "nightly" (must match your T3 Desktop / T3 Mobile channel)
  channel: stable
  # Default false: update cleanly during `bake`, never mutate a live chat VM mid-session
  autoUpdateOnWake: false
  # Optional JSON file merged into `~/.t3/userdata/settings.json` on every VM boot (providers, defaults, etc.)
  # Start from `t3-settings.example.json`; see "Devin and Antigravity" in README.md. Use an absolute path.
  # settingsFile: /opt/t3-boat-sentinel/t3-settings.json
  # Optional ACP Registry agents & managed provider runtimes to pre-install into `base-t3` during `bake base`.
  # Every bake (base and project) then waits until their provider status caches report installed and
  # fails instead of saving a snapshot that would show them as "Not found".
  # prepareAcpAgents: [devin]
  # installProviders: [antigravity]
  # Optional provider instances whose sign-in follows you across chat VMs, by instance ID (the keys under
  # `providerInstances`). Supported: driver antigravity, and driver acpRegistry with config.agentId devin.
  # Sign in once in any Hub chat: sentinel copies the credential file to `<stateDir>/credentials/<instanceId>/`
  # (0600) and places it in every new VM before T3 starts. It is never baked into a snapshot. Signing out in
  # T3, or `sentinel forget-session <instanceId>`, deletes the stored copy.
  # persistProviderSessions: [antigravity, acpRegistry_devin]

boat:
  # Optional explicit path to boat binary (auto-detects ~/.ascii/bin/boat or PATH)
  # bin: /root/.ascii/bin/boat
  # Upstream port visibility on Boat: "private" (default, Boat `_port_auth` cookie gate -> 403 to internet) or "public"
  hostVisibility: private
  # Default VM size for new chats ("default" = 2vCPU/4GB, "medium", "large" = 4vCPU/8GB)
  defaultSize: large
  # Immutable golden base snapshot (Ubuntu + t3 + watchdog + optional klav-forward)
  baseSnapshot: base-t3
  # Optional daily UTC hour (0-23) to refresh base-t3 automatically
  # baseBakeHourUtc: 3
  # Optional shell command run during `bake base` to install extra base tooling (e.g. tailscale, CLIs)
  # baseBakeCmd: |
  #   set -e
  #   npm install -g pnpm
  # Pause an active sandbox after this many seconds of inactivity (no agents, no CPU build, no traffic)
  sleepAfterSecs: 600
  # Grace period after a chat is settled/archived before acting
  archiveGraceSecs: 20
  # Trigger cleanup when all top-level chats are: "archived" | "archived-or-settled"
  deleteWhen: archived-or-settled
  # Action on settle/archive: "delete" (permanently delete VM -> $0) | "stop" (pause VM; Boat keeps disk 14d)
  archiveAction: delete
  # How often sentinel reconciles `boat list --all` to kill orphan sandboxes
  reaperIntervalSecs: 300
  # Optional safety cap in hours for sleeping sandboxes (0 = disabled)
  maxSleepingHours: 0
  # Prefix for sandboxes managed by sentinel (reaper only touches sandboxes with this prefix)
  sandboxPrefix: t3s-
  # Optional files on sentinel uploaded at VM spawn time (never baked into golden snapshots!)
  # injectFiles:
  #   - from: /opt/t3-boat-sentinel/extra-config.json
  #     to: ~/.config/my-tool/config.json
  #     mode: "600"

# Optional: Zero-trust per-sandbox LLM API proxy (e.g. forwarding to a private LAN/Tailscale CLIProxy).
# Boat VMs NEVER join your LAN/Tailnet for LLM calls and NEVER see `upstreamApiKey` — each running VM
# receives a unique ephemeral `t3llm_...` token that immediately returns 401 when the VM sleeps or is deleted!
# llmProxy:
#   host: boat-llm.example.com
#   upstreamUrl: http://192.168.1.248:8317
#   upstreamApiKey: ${LLM_UPSTREAM_API_KEY}

# Optional: Klav (https://klav.dev) zero-knowledge secrets provider (ADR 0036 + ADR 0042).
# Real API keys stay on `klav-proxy`; each Boat VM gets a scoped ephemeral sandbox over `tag:klav-sandbox` Tailnet
# that is automatically revoked when the chat is settled or archived.
# klav:
#   mode: proxy
#   bin: /usr/local/bin/klav
#   issuerHome: /var/lib/klav-issuer
#   issuerAgent: sandbox-issuer
#   forwardBinaryPath: /opt/t3-boat-sentinel/klav-assets/klav-forward
#   tailnetUpScriptPath: /opt/t3-boat-sentinel/klav-assets/klav-tailnet-up
#   skillPath: /opt/t3-boat-sentinel/klav-assets/SKILL.md
#   proxyPort: 8790
#   defaultTtl: 8h

# Wake behavior when T3 connects to a sleeping legacy slot ("manual" | "on-connect")
wakePolicy: manual

# Optional legacy fixed slots (leave empty `[]` when using Hub Mode above!)
slots: []

# Immutable golden snapshots per project (always baked from base-t3).
# Tip: You can also add/remove repos dynamically WITHOUT editing this file via:
#   - T3 Code UI (Clone repo)
#   - Dashboard (`https://boat-ctrl.example.com` -> "+ Add GitHub Repo")
#   - API (`POST /api/projects`) or MCP (`sentinel_add_project`)
projects:
  my-app:
    snapshot: env-my-app
    # size: large   # optional per-project override (defaults to boat.defaultSize)
    repo: https://github.com/your-org/my-app.git
    workdir: /home/user/my-app
    bakeCmd: |
      set -e
      if [ ! -d /home/user/my-app/.git ]; then
        git clone https://github.com/your-org/my-app.git /home/user/my-app
      fi
      cd /home/user/my-app
      git fetch --all --prune
      git reset --hard origin/$(git symbolic-ref --short HEAD 2>/dev/null || echo main)
      if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile;
      elif [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile;
      elif [ -f package-lock.json ]; then npm ci; fi
    bootCmd: |
      cd /home/user/my-app && git fetch origin --prune || true
    # Optional Klav proxy profiles granted to this repo's VMs:
    # klav:
    #   profiles: [northflank]
    #   ttl: 8h
    bakeHourUtc: 4

  scratch:
    snapshot: base-t3
    workdir: /home/user
