<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-label="t3-boat-sentinel architecture: 1 T3 Environment to N disposable isolated cloud sandboxes">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#111622"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#131824"/>
    </linearGradient>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <style>
    .title { font: 700 20px system-ui, -apple-system, Segoe UI, sans-serif; fill: #f1f5f9; }
    .subtitle { font: 400 12.5px system-ui, -apple-system, Segoe UI, sans-serif; fill: #94a3b8; }
    .colTitle { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #94a3b8; letter-spacing: 0.08em; }
    .cardTitle { font: 700 13.5px system-ui, -apple-system, Segoe UI, sans-serif; fill: #f8fafc; }
    .cardSub { font: 400 11px system-ui, -apple-system, Segoe UI, sans-serif; fill: #94a3b8; }
    .mono { font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #cbd5e1; }
    .pillText { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .edgeLabel { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #cbd5e1; }
  </style>

  <!-- Canvas -->
  <rect width="1080" height="600" rx="16" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="38" class="title">t3-boat-sentinel</text>
  <text x="200" y="38" class="subtitle">1 T3 Code Environment  →  N Disposable Isolated Cloud Sandboxes  ·  $0/hr Idle</text>
  <rect x="858" y="20" width="194" height="26" rx="13" fill="#172554" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="955" y="37" text-anchor="middle" class="pillText" fill="#7dd3fc">0 T3 CONNECT TUNNELS</text>

  <!-- Column headers -->
  <text x="28" y="76" class="colTitle">1. CLIENTS (PAIRED ONCE)</text>
  <text x="292" y="76" class="colTitle">2. SENTINEL (LXC / VPS / WORKERS)</text>
  <text x="742" y="76" class="colTitle">3. DISPOSABLE SANDBOXES</text>

  <!-- ==================== COLUMN 1: CLIENTS ==================== -->
  <!-- T3 Desktop & Mobile -->
  <rect x="28" y="92" width="212" height="148" rx="12" fill="#151924" stroke="#f59e0b" stroke-opacity="0.65" stroke-width="1.4"/>
  <text x="44" y="118" class="cardTitle">T3 Code Desktop &amp; Mobile</text>
  <text x="44" y="136" class="cardSub">Official app — zero forks</text>
  <rect x="44" y="148" width="180" height="24" rx="6" fill="#0f131c" stroke="#2d3748"/>
  <text x="54" y="164" class="mono" fill="#fbbf24">wss://boat.example.com</text>
  <text x="44" y="191" class="cardSub">• 1 single "Boat" Environment</text>
  <text x="44" y="207" class="cardSub">• Live boot progress in UI</text>
  <text x="44" y="223" class="cardSub">• Native Clone repo onboarding</text>

  <!-- Control Dashboard & MCP -->
  <rect x="28" y="274" width="212" height="132" rx="12" fill="#151924" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="44" y="300" class="cardTitle">Dashboard · CLI · MCP</text>
  <text x="44" y="318" class="cardSub">Web UI, iOS Shortcuts, Agents</text>
  <rect x="44" y="330" width="180" height="24" rx="6" fill="#0f131c" stroke="#2d3748"/>
  <text x="134" y="345" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="500" fill="#7dd3fc">https://boat-ctrl.example.com</text>
  <rect x="44" y="366" width="180" height="24" rx="6" fill="#052e16" stroke="#22c55e" stroke-opacity="0.6"/>
  <text x="134" y="382" text-anchor="middle" class="pillText" fill="#86efac">CF ACCESS + RS256 + 429</text>

  <!-- Private Infra (Optional) -->
  <rect x="28" y="440" width="212" height="126" rx="12" fill="#151924" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="44" y="466" class="cardTitle">Private Gateways (Optional)</text>
  <text x="44" y="484" class="cardSub">Never exposed to sandboxes</text>
  <text x="44" y="508" class="mono" fill="#c4b5fd">• LAN/Tailnet LLM Gateway</text>
  <text x="44" y="526" class="mono" fill="#c4b5fd">• klav-proxy (ADR 0036/0042)</text>
  <text x="44" y="548" class="cardSub">Zero plaintext keys inside VMs</text>

  <!-- ==================== COLUMN 2: SENTINEL ==================== -->
  <rect x="292" y="92" width="390" height="474" rx="14" fill="url(#hubGrad)" stroke="#334155" stroke-width="1.5"/>
  <text x="312" y="118" class="cardTitle">t3-boat-sentinel</text>
  <text x="444" y="118" class="cardSub">~40 MB RAM · zero project code runs here</text>

  <!-- Hub Multiplexer Box -->
  <rect x="310" y="134" width="354" height="132" rx="10" fill="#0f1420" stroke="#f59e0b" stroke-opacity="0.6"/>
  <text x="326" y="156" class="cardTitle" fill="#fbbf24">Hub RPC Multiplexer (1 Env → N VMs)</text>
  <text x="326" y="175" class="cardSub">• Single-use OAuth pairing + 256-bit Bearer (SHA-256)</text>
  <text x="326" y="192" class="cardSub">• Spawns 1 fresh VM per chat (`orchestration.launchThread`)</text>
  <text x="326" y="209" class="cardSub">• Streams live boot stages (`subscribeWorktreeSetup`)</text>
  <text x="326" y="226" class="cardSub">• Routes thread / terminal / VCS / files to owning VM</text>
  <text x="326" y="243" class="cardSub">• Dynamic repos (`projectClone.start` + `/api/projects`)</text>

  <!-- Security & Control Box -->
  <rect x="310" y="280" width="354" height="84" rx="10" fill="#0f1420" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="326" y="302" class="cardTitle" fill="#7dd3fc">Control Plane · Watchdog Receiver · Reaper</text>
  <text x="326" y="321" class="cardSub">• `/internal/watchdog` (per-VM 256-bit secret, CF Bypass)</text>
  <text x="326" y="338" class="cardSub">• Auto-deletes VM on Settle/Archive (20s undo grace)</text>
  <text x="326" y="355" class="cardSub">• 5m Reaper reconciles orphans (protects in-flight boots)</text>

  <!-- Zero-Trust Proxy Box -->
  <rect x="310" y="378" width="354" height="80" rx="10" fill="#0f1420" stroke="#a78bfa" stroke-opacity="0.55"/>
  <text x="326" y="400" class="cardTitle" fill="#c4b5fd">Zero-Trust LlmProxy &amp; Klav Issuer</text>
  <text x="326" y="419" class="cardSub">• `boat-llm`: ephemeral `t3llm_...` → 401 on sleep/delete</text>
  <text x="326" y="436" class="cardSub">• Klav: ephemeral `tag:klav-sandbox` Tailnet + `klav-forward`</text>
  <text x="326" y="452" class="cardSub">• Instant token &amp; sandbox revocation when chat ends</text>

  <!-- Modular SandboxProvider Box -->
  <rect x="310" y="472" width="354" height="78" rx="10" fill="#0f1420" stroke="#22c55e" stroke-opacity="0.55"/>
  <text x="326" y="494" class="cardTitle" fill="#86efac">Modular SandboxProvider (`src/providers/`)</text>
  <text x="326" y="513" class="cardSub">• Native BoatProvider (`--private` `_port_auth`, snapshots)</text>
  <text x="326" y="530" class="cardSub">• SandboxSdkProvider: Daytona, E2B, Docker, Freestyle,</text>
  <text x="326" y="544" class="cardSub">  Upstash Box, Railway, boxd, Vercel, Superserve...</text>

  <!-- ==================== COLUMN 3: SANDBOXES ==================== -->
  <!-- Immutable Golden Snapshots -->
  <rect x="742" y="92" width="310" height="96" rx="12" fill="#151924" stroke="#22c55e" stroke-opacity="0.65" stroke-width="1.3"/>
  <text x="758" y="116" class="cardTitle" fill="#86efac">Immutable Golden Snapshots</text>
  <text x="758" y="135" class="mono">base-t3  ──▶  env-&lt;project&gt;</text>
  <text x="758" y="155" class="cardSub">t3 serve · watchdog · Devin · Antigravity · deps</text>
  <text x="758" y="172" class="cardSub">Never mutated by chats — clean `bake` only</text>

  <!-- VM 1 -->
  <rect x="742" y="216" width="310" height="98" rx="12" fill="#151924" stroke="#f59e0b" stroke-opacity="0.6"/>
  <text x="758" y="239" class="cardTitle">Chat #1  →  VM bx_a1 (large)</text>
  <rect x="960" y="222" width="78" height="20" rx="10" fill="#451a03" stroke="#f59e0b"/>
  <text x="999" y="236" text-anchor="middle" class="pillText" fill="#fcd34d">PRIVATE 403</text>
  <text x="758" y="259" class="mono">t3 serve + watchdog.mjs + klav-forward</text>
  <text x="758" y="278" class="cardSub">• Cookie `_port_auth` + T3 Bearer token</text>
  <text x="758" y="295" class="cardSub">• Unique `t3llm_...` + unique `watchdogSecret`</text>

  <!-- VM 2 -->
  <rect x="742" y="330" width="310" height="84" rx="12" fill="#151924" stroke="#f59e0b" stroke-opacity="0.45"/>
  <text x="758" y="353" class="cardTitle">Chat #2  →  VM bx_b2 (large)</text>
  <rect x="960" y="336" width="78" height="20" rx="10" fill="#451a03" stroke="#f59e0b"/>
  <text x="999" y="350" text-anchor="middle" class="pillText" fill="#fcd34d">PRIVATE 403</text>
  <text x="758" y="373" class="mono">Isolated filesystem, git worktree &amp; agents</text>
  <text x="758" y="393" class="cardSub">• Runs 100% in parallel (up to 20+ VMs)</text>

  <!-- VM N / Auto-delete -->
  <rect x="742" y="430" width="310" height="136" rx="12" fill="#181219" stroke="#f87171" stroke-opacity="0.6" stroke-dasharray="5 4"/>
  <text x="758" y="454" class="cardTitle" fill="#fca5a5">Settle or Archive Chat  →  $0</text>
  <text x="758" y="476" class="cardSub">1. `watchdog.mjs` detects settled/archived thread</text>
  <text x="758" y="494" class="cardSub">2. Waits 20s undo grace, notifies Sentinel</text>
  <text x="758" y="512" class="cardSub">3. Sentinel destroys ONLY that VM (`boat delete`)</text>
  <text x="758" y="530" class="cardSub">4. Revokes `t3llm_...` (401) + Klav sandbox</text>
  <text x="758" y="548" class="cardSub">5. Other parallel chats keep running untouched</text>

  <!-- ==================== ARROWS ==================== -->
  <!-- Clients -> Hub -->
  <line x1="240" y1="166" x2="308" y2="166" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="274" y="158" text-anchor="middle" class="edgeLabel" fill="#fbbf24">WSS</text>

  <!-- Dashboard -> Control -->
  <line x1="240" y1="322" x2="308" y2="322" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="274" y="314" text-anchor="middle" class="edgeLabel" fill="#7dd3fc">HTTPS</text>

  <!-- Sentinel -> Private Gateways -->
  <line x1="308" y1="440" x2="242" y2="495" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrowPurple)"/>

  <!-- Snapshots -> VMs (clone from) -->
  <line x1="897" y1="188" x2="897" y2="214" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Hub -> VM 1 & VM 2 -->
  <path d="M 664 200 C 705 200, 705 262, 740 262" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M 664 218 C 705 218, 705 370, 740 370" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-opacity="0.75" marker-end="url(#arrowAmber)"/>
  <rect x="673" y="174" width="66" height="18" rx="5" fill="#0b0e14" stroke="#f59e0b" stroke-opacity="0.45"/>
  <text x="706" y="186" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600" fill="#fbbf24">_port_auth</text>

  <!-- Watchdog -> Control (auto-delete loop) -->
  <path d="M 740 486 C 700 486, 700 322, 666 322" fill="none" stroke="#f87171" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>
</svg>
